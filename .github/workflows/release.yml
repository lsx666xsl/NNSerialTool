name: Release

# 两种触发方式：
#   1. 推送 v 开头的 git 标签（如 v0.5.1）→ 正式发布：四平台构建+签名+自动创建 Release 挂附件
#   2. Actions 页面手动 Run workflow → 验证构建：只出包不上传，产物在运行页 Artifacts 下载
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 允许自动创建 Release

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不影响其他平台继续出包
      matrix:
        include:
          - platform: windows-latest
            rust-target: ''
            args: ''
          - platform: ubuntu-22.04
            rust-target: ''
            args: ''
          - platform: macos-latest
            rust-target: aarch64-apple-darwin     # Apple Silicon (M 系列)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust-target: x86_64-apple-darwin      # Intel Mac
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    env:
      # 更新签名私钥（配置在仓库 Secrets 里）；私钥为空密码，Secret 缺省时解析为空串即可
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libudev-dev libfontconfig1-dev pkg-config build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # 缓存 Rust 编译产物，第二次构建起明显提速
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # ---- nn CLI 二进制作为资源随主程序打包，必须先于 tauri build 构建 ----
      # 鸡生蛋问题：tauri 的 build.rs 在编译期校验资源存在，而 nn.exe 正是本次要构建的——
      # 先放占位资源通过校验，nn 链接完成后自动覆盖为真实二进制；
      # macOS 交叉编译产物在 target/<triple>/release/，复制到资源路径 src-tauri/target/release/nn
      - name: Build nn CLI
        shell: bash
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/nn src-tauri/target/release/nn.exe
          cargo build --release --bin nn --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}
          if [ -n "${{ matrix.rust-target }}" ] && [ -f "src-tauri/target/${{ matrix.rust-target }}/release/nn" ]; then
            cp "src-tauri/target/${{ matrix.rust-target }}/release/nn" src-tauri/target/release/nn
          fi

      # ---- 正式发布（tag 触发）：构建 + 签名 + 创建/追加 Release，含各平台更新器 latest.json ----
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NNSerialTool v__VERSION__'
          releaseBody: '修复 Linux 下拉浮层在界面缩放下的错位问题。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # ---- 验证构建（手动触发）：只出包，产物存到运行页 Artifacts ----
      - name: Verification build
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload verification artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # ---- 发布收尾：四个平台全部构建完成后，把 Release 里生成的 latest.json
  #      自动提交回仓库根，让 jsDelivr 备用更新源保持同步（替代手工同步）----
  sync-latest-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download latest.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f latest.json   # 仓库根本就提交了上一版的 latest.json，gh download 拒绝覆盖已存在文件
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json --output latest.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet latest.json; then
            echo "latest.json 无变化，跳过提交"
          else
            git add latest.json
            git commit -m "chore: latest.json 同步至 ${{ github.ref_name }}（jsDelivr 备用更新源）"
            git push origin master
          fi
