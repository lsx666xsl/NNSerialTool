name: Release

# 两种触发方式：
#   1. 推送 v 开头的 git 标签（v0.6.0）→ 正式发布：构建+签名+自动创建 Release 挂附件
#   2. Actions 页面手动 Run workflow → 验证构建：只出包不上传，产物在运行页 Artifacts 下载
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 允许自动创建 Release

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 更新签名私钥（配置在仓库 Secrets 里，见 doc/交接与任务进度.md）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # 私钥为空密码，Secret 未配置时此变量解析为空串，与本机手动构建一致
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 编译产物，第二次构建起明显提速
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # ---- 正式发布（tag 触发）----
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NNSerialTool v__VERSION__'
          releaseBody: '设置菜单底部新增当前版本号显示。'
          releaseDraft: false
          prerelease: false
          # 自动生成 latest.json（含签名）挂到 Release，应用内更新直接可用
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # ---- 验证构建（手动触发）----
      - name: Verification build
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build

      - name: Upload verification artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
