name: Release

# 两种触发方式：
#   1. 推送 v 开头的 git 标签（如 v0.5.1）→ 正式发布：四平台构建+签名+自动创建 Release 挂附件
#   2. Actions 页面手动 Run workflow → 验证构建：只出包不上传，产物在运行页 Artifacts 下载
#
# 供应链说明（残余风险）：本文件用到的第三方 action 均保留 major tag（如 @v4 / @v0），
# 没有固定到 commit SHA——本仓库维护环境离线，无法核验 SHA，绝不伪造。
# 联网环境应尽快按 TODO 注释逐个改为 SHA 固定版本，降低 tag 被移动/仓库被接管的供应链风险。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 允许自动创建 Release

# 同一 ref 的发布流程串行执行；不取消进行中的发布（避免半成品 Release）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不影响其他平台继续出包
      matrix:
        include:
          - platform: windows-latest
            rust-target: ''
            args: ''
          - platform: ubuntu-22.04
            rust-target: ''
            args: ''
          - platform: macos-latest
            rust-target: aarch64-apple-darwin     # Apple Silicon (M 系列)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust-target: x86_64-apple-darwin      # Intel Mac
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      # TODO: pin to commit SHA（actions/checkout@v4）
      - uses: actions/checkout@v4

      # 版本一致性守卫（fail fast）：
      #   - tag 触发时 tag 必须等于 v<tauri.conf.json version>（否则会产出与 tag 不符的安装包）
      #   - package.json / tauri.conf.json / Cargo.toml 三处版本必须一致
      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(awk -F'"' '/^version = "/ { print $2; exit }' src-tauri/Cargo.toml)
          echo "tauri.conf.json=$TAURI_VER  package.json=$PKG_VER  Cargo.toml=$CARGO_VER"
          if [ "$TAURI_VER" != "$PKG_VER" ] || [ "$TAURI_VER" != "$CARGO_VER" ]; then
            echo "::error::版本不一致：tauri.conf.json=$TAURI_VER package.json=$PKG_VER Cargo.toml=$CARGO_VER"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "v$TAURI_VER" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 tauri.conf.json 版本 v$TAURI_VER 不一致"
              exit 1
            fi
            echo "tag 与版本一致：$GITHUB_REF_NAME"
          fi

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libudev-dev libfontconfig1-dev pkg-config build-essential file

      # TODO: pin to commit SHA（actions/setup-node@v4）
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 与 package.json engines（>=22）及测试脚本依赖的全局 WebSocket 对齐
          cache: npm

      # TODO: pin to commit SHA（dtolnay/rust-toolchain@stable）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # 缓存 Rust 编译产物，第二次构建起明显提速
      # TODO: pin to commit SHA（swatinem/rust-cache@v2）
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # ---- nn CLI 二进制作为资源随主程序打包，必须先于 tauri build 构建 ----
      # 鸡生蛋问题：tauri 的 build.rs 在编译期校验资源存在，而 nn 正是本次要构建的——
      # 先放占位资源通过校验；nn 编译到独立 CARGO_TARGET_DIR（产物路径可预测、不污染
      # 主 target），构建后 cp -f 覆盖占位，并断言产物存在、>100KB，Windows 还校验 MZ 头，
      # 避免 0 字节/占位文件被打进安装包（曾出现"更新后 nn 是空文件"的问题）。
      - name: Build nn CLI
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          CARGO_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release
          : > src-tauri/target/release/nn
          : > src-tauri/target/release/nn.exe
          export CARGO_TARGET_DIR=src-tauri/target/nn-build
          cargo build --release --bin nn --manifest-path src-tauri/Cargo.toml --locked $CARGO_ARGS
          if [ -n "$RUST_TARGET" ]; then
            NN_BIN="$CARGO_TARGET_DIR/$RUST_TARGET/release/nn"
          else
            NN_BIN="$CARGO_TARGET_DIR/release/nn"
          fi
          if [ -f "$NN_BIN.exe" ]; then
            NN_BIN="$NN_BIN.exe"
          fi
          if [ ! -f "$NN_BIN" ]; then
            echo "::error::nn 构建产物不存在：$NN_BIN"
            find "$CARGO_TARGET_DIR" -type f -name 'nn*' || true
            exit 1
          fi
          SIZE=$(wc -c < "$NN_BIN")
          echo "nn 产物：${NN_BIN}（${SIZE} 字节）"
          if [ "$SIZE" -lt 102400 ]; then
            echo "::error::nn 产物只有 $SIZE 字节（<100KB），疑似 0 字节/占位文件"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # 只需读 2 字节：PE 文件以 ASCII "MZ" 开头；用 head 而非 od，Git Bash 兼容性更好
            MAGIC=$(head -c 2 "$NN_BIN")
            if [ "$MAGIC" != "MZ" ]; then
              echo "::error::nn.exe 缺少 MZ 头（magic='$MAGIC'），不是有效 PE 文件"
              exit 1
            fi
          fi
          cp -f "$NN_BIN" src-tauri/target/release/nn
          cp -f "$NN_BIN" src-tauri/target/release/nn.exe

      # ---- 正式发布（tag 触发）：构建 + 签名 + 创建/追加 Release，含各平台更新器 latest.json ----
      # 说明正文由 sync-release-notes 工作流统一写入（多行正文经 action 输入传递不可靠）
      # 签名私钥只在本 step 可见：其它 step（npm ci / 构建 / 验证包）不需要，也不应拿到
      # TODO: pin to commit SHA（tauri-apps/tauri-action@v0）
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NNSerialTool v__VERSION__'
          releaseBody: '更新内容详见 RELEASE_NOTES.md 与更新日志卡片。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}


      # ---- 验证构建（手动触发）：只出包，产物存到运行页 Artifacts ----
      # 签名私钥按最小权限只给正式发布 step，这里拿不到密钥；createUpdaterArtifacts
      # 必须显式关掉（tauri 在开启该选项且没有私钥时会直接报错），验证包也不需要更新器签名。
      - name: Verification build
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # macOS 安装诊断：Tauri 打完 dmg 后会清理 .app 目录，必须从 dmg 里重新挂载检查。
      # 期望：Identity "-" ad-hoc、codesign --verify --deep --strict 通过；
      # 无 Apple 证书时 spctl 仍会拒绝（未公证），但不会再是“damaged/invalid signature”。
      - name: Inspect macOS signature
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: |
          set -x
          DMG=$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)
          echo "DMG=$DMG"
          test -n "$DMG"
          ATTACH_OUT=$(hdiutil attach "$DMG" -nobrowse -readonly) || exit 1
          MOUNT=$(echo "$ATTACH_OUT" | awk '/\/Volumes\//{print $NF; exit}')
          APP=$(find "$MOUNT" -maxdepth 2 -name '*.app' -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv "$APP" 2>&1 || true
          hdiutil detach "$MOUNT" -force || true

      # TODO: pin to commit SHA（actions/upload-artifact@v4）
      - name: Upload verification artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          # 两个 macOS 矩阵项共享 platform 名，必须带 rust-target 区分，否则 v4 重名上传失败
          name: ${{ matrix.platform }}-${{ matrix.rust-target || 'default' }}-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # ---- 发布收尾：构建完成后，把 Release 里生成的 latest.json
  #      自动提交回仓库根，让 jsDelivr 备用更新源保持同步（替代手工同步）----
  # 部分平台失败也尝试同步（tauri-action 成功创建 Release 即有 latest.json）；
  # 被取消则不同步；Release 不存在（全部失败）时下面会安全跳过。
  sync-latest-json:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to commit SHA（actions/checkout@v4）
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Check release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ github.ref_name }} 不存在（所有平台构建可能都失败），跳过 latest.json 同步"
          fi

      - name: Download latest.json from release
        id: download
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f latest.json   # 仓库根本就提交了上一版的 latest.json，gh download 拒绝覆盖已存在文件
          if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json --output latest.json; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release 中没有 latest.json 附件（更新器产物可能缺失），跳过同步"
          fi

      - name: Apply release notes (body + latest.json notes)
        if: steps.download.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md
          python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); d["notes"]=open("RELEASE_NOTES.md",encoding="utf-8").read(); json.dump(d,open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)' latest.json
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" latest.json --clobber

      - name: Commit and push
        if: steps.download.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet latest.json; then
            echo "latest.json 无变化，跳过提交"
          else
            git add latest.json
            git commit -m "chore: latest.json 同步至 ${{ github.ref_name }}（jsDelivr 备用更新源）"
            git push origin master
          fi
