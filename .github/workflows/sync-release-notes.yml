# RELEASE_NOTES.md 变更即同步到对应版本的 GitHub Release 说明
# （含更新器 latest.json 的 notes 字段——应用内更新卡片展示的内容）。
# 目标版本取仓库根 latest.json 的 version（无该版本 Release 时静默跳过）。
name: Sync release notes

on:
  push:
    branches: [master]
    paths: ['RELEASE_NOTES.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply notes to matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("latest.json", encoding="utf-8"))["version"])')
          TAG="v$VER"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG 不存在，跳过"
            exit 0
          fi
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern latest.json --output latest.json.release || true
          if [ -f latest.json.release ]; then
            python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); d["notes"]=open("RELEASE_NOTES.md",encoding="utf-8").read(); json.dump(d,open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)' latest.json.release
            gh release upload "$TAG" --repo "${{ github.repository }}" latest.json.release --clobber
            mv latest.json.release latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet latest.json; then
              git add latest.json
              git commit -m "chore: latest.json notes 同步（$TAG）"
              git push origin master
            fi
          fi
          echo "Release $TAG 说明已同步"
